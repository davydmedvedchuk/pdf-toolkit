<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF toolkit</title>
<meta name="description" content="Merge, split, reorder, rotate and delete PDF pages. Turn photos into a PDF. Everything runs in your browser, nothing is uploaded.">
<meta name="theme-color" content="#F3F3F0">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F3F3F0;--surface:#fff;--ink:#15171B;--muted:#62666F;--line:#D5D6D9;--line2:#B4B7BD;--mark:#E5484D;--mark-ink:#fff;--sel:#15171B;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;--body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#131417;--surface:#1B1D21;--ink:#ECEDEF;--muted:#9EA2AA;--line:#2C2F35;--line2:#454952;--sel:#ECEDEF;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 150px}
header{display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:2px solid var(--ink)}
header img{width:64px;height:48px}
h1{margin:0;font:800 34px/1 var(--display);font-stretch:80%}
header p{margin:6px 0 0;font:400 13px var(--mono);color:var(--muted)}
header a.back{margin-left:auto;font:400 13px var(--mono);color:var(--ink);text-decoration:underline;white-space:nowrap}
.drop{display:block;margin:22px 0 14px;border:2px dashed var(--line2);padding:30px 16px;text-align:center;cursor:pointer;background:transparent}
.drop.over{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 8%,transparent)}
.drop b{display:block;font:700 22px var(--display);font-stretch:85%;margin-bottom:6px}
.drop span{font:400 13px var(--mono);color:var(--muted)}
#err{display:none;margin:10px 0;padding:10px 14px;border:1.5px solid var(--mark);font:400 13px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1.5px solid var(--line);position:relative;display:flex;flex-direction:column;user-select:none}
.card.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.card.drag{opacity:.35}
.card.over{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark)}
.th{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--ink) 5%,var(--surface));cursor:grab}
.th img{max-width:100%;max-height:100%;transition:transform .2s;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.meta{display:flex;align-items:center;gap:6px;padding:7px 8px;font:400 11px var(--mono);color:var(--muted)}
.meta .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{z-index:2;pointer-events:none;position:absolute;left:6px;top:6px;background:var(--ink);color:var(--bg);font:500 11px var(--mono);padding:1px 6px}
.tools{display:flex;border-top:1px solid var(--line)}
.tools button{flex:1;border:0;background:none;color:var(--ink);font:600 15px var(--body);padding:9px 0;cursor:pointer;border-right:1px solid var(--line)}
.tools button:last-child{border-right:0}
.tools button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tools .x{color:var(--mark)}
.chk{z-index:2;position:absolute;right:6px;top:6px;width:24px;height:24px;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;font-weight:800;cursor:pointer;color:var(--bg)}
.card.sel .chk{background:var(--sel)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .tot{font:400 13px var(--mono);flex:1;min-width:140px}
button.b{font:700 15px var(--body);padding:12px 16px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.b.go{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
button.b:disabled{opacity:.4;cursor:default}
.empty{margin-top:30px;font:400 13px var(--mono);color:var(--muted);text-align:center}
.hint{margin-top:10px;font:400 12px var(--mono);color:var(--muted)}

@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(vendor/fonts/inter-latin-400-normal.woff) format("woff");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(vendor/fonts/inter-cyrillic-400-normal.woff) format("woff");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Inter";font-weight:700;font-display:swap;src:url(vendor/fonts/inter-latin-700-normal.woff) format("woff");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-weight:700;font-display:swap;src:url(vendor/fonts/inter-cyrillic-700-normal.woff) format("woff");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
.tools button{font-size:14px}
.badge{color:var(--mark);font-weight:600}
#ed,#sg{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#ed[hidden],#sg[hidden]{display:none}
#sg{z-index:30;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px}
.edtop{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--ink)}
.edtop b{font:700 16px var(--display);font-stretch:85%;flex:1}
.edtop .b{padding:8px 14px;font-size:14px}
.edtools{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.edtools button{flex:0 0 auto;font:600 14px var(--body);padding:8px 12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.edtools button.on{background:var(--ink);color:var(--bg)}
.edhint{font:400 12px var(--mono);color:var(--muted);padding:6px 14px}
.edstage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;background:color-mix(in srgb,var(--ink) 6%,var(--bg));overflow:hidden}
#edCv{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25);touch-action:none;cursor:crosshair;display:block}
.edpanel{border-top:2px solid var(--ink);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edpanel[hidden]{display:none}
.edpanel textarea{flex:1 1 100%;font:400 15px var(--body);padding:8px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);resize:none;min-height:44px}
.edpanel button,.edpanel input[type=text]{font:600 14px var(--body);padding:8px 12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.edpanel input[type=text]{cursor:text;font-weight:400;min-width:110px;flex:1}
.edpanel .sw{width:30px;height:30px;padding:0;border-radius:50%}
.edpanel .x{color:var(--mark);border-color:var(--mark)}
.sgbox{background:var(--surface);color:var(--ink);padding:16px;width:min(640px,100%);border:2px solid var(--ink)}
.sgbox h3{margin:0 0 10px;font:700 18px var(--display);font-stretch:85%}
#sgCv{width:100%;aspect-ratio:3/1;background:#fff;border:1.5px dashed var(--line2);touch-action:none;display:block}
.sgrow{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.sgrow .sp{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.svg" alt="">
    <div><h1>PDF toolkit</h1><p>Merge, split, reorder, rotate, edit.<br>Nothing leaves your device.</p></div>
    <a class="back" href="../">← all</a>
  </header>

  <label class="drop" id="drop" for="file">
    <b>Add PDFs or photos</b>
    <span>or drop them here · PDF · JPG · PNG</span>
  </label>
  <input id="file" type="file" accept="application/pdf,image/jpeg,image/png,.pdf" multiple hidden>
  <div id="err" role="alert"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">Add files and their pages appear here. Drag to reorder.</div>
  <p class="hint" id="hint" hidden>Tap a page to select it, ✎ to edit it. Select some, then "Selected" saves only those.</p>
</div>

<div class="bar"><div class="in">
  <div class="tot" id="tot">No pages yet</div>
  <button class="b" id="clear" disabled>Clear</button>
  <button class="b" id="zip" disabled>Split to ZIP</button>
  <button class="b" id="selBtn" disabled>Selected</button>
  <button class="b go" id="save" disabled>Save PDF</button>
</div></div>


<div id="ed" hidden>
  <div class="edtop"><b id="edTitle">Edit page</b><button class="b" id="edCancel">Cancel</button><button class="b go" id="edDone">Done</button></div>
  <div class="edtools" id="edTools">
    <button data-tool="move" class="on">Move</button><button data-tool="text">Add text</button><button data-tool="edit">Edit text</button><button data-tool="stamp">Stamp</button><button data-tool="sign">Sign</button><button data-tool="cover">White out</button>
  </div>
  <div class="edhint" id="edHint"></div>
  <div class="edstage" id="edStage"><canvas id="edCv"></canvas></div>
  <div class="edpanel" id="edPanel" hidden></div>
</div>
<div id="sg" hidden><div class="sgbox">
  <h3>Draw your signature</h3>
  <canvas id="sgCv" width="900" height="300"></canvas>
  <div class="sgrow">
    <button class="b" id="sgInk0">Black</button><button class="b" id="sgInk1">Blue</button><span class="sp"></span>
    <button class="b" id="sgLast" hidden>Use last</button><button class="b" id="sgClear">Clear</button><button class="b" id="sgNo">Cancel</button><button class="b go" id="sgOk">Use</button>
  </div>
</div></div>

<script src="vendor/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjs from './vendor/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.min.mjs', import.meta.url).href;

const $ = (id) => document.getElementById(id);
const { PDFDocument, degrees, rgb } = PDFLib;
const files = new Map();          // id -> { name, bytes (Uint8Array), doc (PDFDocument, lazy) }
let pages = [];                   // { id, file, index, kind:'pdf'|'img', rot, thumb, label, sel }
let seq = 0, busy = false;

const err = (m) => { const e = $('err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };

/* ---------- adding files ---------- */
async function addFiles(list) {
  err('');
  for (const f of list) {
    const name = f.name, low = name.toLowerCase();
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const id = ++seq;
      if (f.type === 'application/pdf' || low.endsWith('.pdf')) {
        const task = pdfjs.getDocument({ data: bytes.slice() });
        const doc = await task.promise;
        files.set(id, { name, bytes });
        for (let i = 0; i < doc.numPages; i++) {
          const pg = await doc.getPage(i + 1);
          const v0 = pg.getViewport({ scale: 1 });
          const vp = pg.getViewport({ scale: 220 / v0.width });
          const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
          await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          pages.push({ id: ++seq, file: id, index: i, kind: 'pdf', rot: 0, thumb: c.toDataURL('image/jpeg', .7), label: name, num: i + 1, sel: false });
          render();
        }
        await doc.destroy();
      } else if (f.type === 'image/jpeg' || f.type === 'image/png' || /\.(jpe?g|png)$/.test(low)) {
        const isPng = f.type === 'image/png' || low.endsWith('.png');
        files.set(id, { name, bytes, png: isPng });
        pages.push({ id: ++seq, file: id, index: 0, kind: 'img', rot: 0, thumb: URL.createObjectURL(new Blob([bytes], { type: isPng ? 'image/png' : 'image/jpeg' })), label: name, num: 1, sel: false });
        render();
      } else err(`Skipped ${name}: only PDF, JPG and PNG.`);
    } catch (e) {
      const enc = /password|encrypt/i.test(String(e && (e.name + e.message)));
      err(enc ? `${name} is password-protected. Remove the password first.` : `Could not open ${name}.`);
    }
  }
}

/* ---------- UI ---------- */
function render() {
  const g = $('grid'); g.innerHTML = '';
  pages.forEach((p, i) => {
    const c = document.createElement('div'); c.className = 'card' + (p.sel ? ' sel' : ''); c.dataset.i = i;
    c.innerHTML = `<div class="num">${i + 1}</div><div class="chk" title="Select">${p.sel ? '✓' : ''}</div>
      <div class="th" draggable="true"><img src="${p.thumb}" alt="" style="transform:rotate(${p.baked ? 0 : p.rot}deg)${!p.baked && p.rot % 180 ? ' scale(.74)' : ''}"></div>
      <div class="meta"><span class="nm">${esc(p.label)}</span><span>${p.ann && p.ann.length ? '<span class="badge">✎' + p.ann.length + '</span> ' : ''}${p.kind === 'pdf' ? 'p.' + p.num : 'img'}</span></div>
      <div class="tools"><button data-a="l" title="Move left">◀</button><button data-a="r" title="Rotate">↻</button><button data-a="e" title="Edit: text, stamp, signature">✎</button><button data-a="m" title="Move right">▶</button><button data-a="x" class="x" title="Delete">✕</button></div>`;
    g.appendChild(c);
  });
  const n = pages.length, s = pages.filter(p => p.sel).length;
  $('empty').style.display = n ? 'none' : 'block'; $('hint').hidden = !n;
  $('tot').textContent = n ? `${n} page${n > 1 ? 's' : ''}${s ? ` · ${s} selected` : ''}` : 'No pages yet';
  $('save').disabled = !n || busy; $('zip').disabled = !n || busy; $('clear').disabled = !n || busy; $('selBtn').disabled = !s || busy;
}
const esc = (s) => s.replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

$('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const i = +card.dataset.i, p = pages[i], a = e.target.dataset.a;
  if (e.target.closest('.chk') || e.target.closest('.th')) p.sel = !p.sel;
  else if (a === 'e') { openEditor(i); return; }
  else if (a === 'r') { p.rot = (p.rot + 90) % 360; if (p.baked) bake(p).then(render); }
  else if (a === 'x') pages.splice(i, 1);
  else if (a === 'l' && i > 0) [pages[i - 1], pages[i]] = [pages[i], pages[i - 1]];
  else if (a === 'm' && i < pages.length - 1) [pages[i + 1], pages[i]] = [pages[i], pages[i + 1]];
  else return;
  render();
});

/* drag to reorder */
let dragFrom = -1;
$('grid').addEventListener('dragstart', (e) => { const c = e.target.closest('.card'); if (!c) return; dragFrom = +c.dataset.i; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
$('grid').addEventListener('dragover', (e) => { if (dragFrom < 0) return; e.preventDefault(); document.querySelectorAll('.card.over').forEach(x => x.classList.remove('over')); e.target.closest('.card')?.classList.add('over'); });
$('grid').addEventListener('drop', (e) => { if (dragFrom < 0) return; e.preventDefault(); e.stopPropagation(); const c = e.target.closest('.card'); if (c) { const to = +c.dataset.i; const [m] = pages.splice(dragFrom, 1); pages.splice(to, 0, m); } dragFrom = -1; render(); });
$('grid').addEventListener('dragend', () => { dragFrom = -1; render(); });

/* drop zone + picker */
const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
window.addEventListener('dragover', e => { if (dragFrom < 0) e.preventDefault(); });
window.addEventListener('drop', e => { if (dragFrom < 0) { e.preventDefault(); addFiles([...e.dataTransfer.files]); } });
$('file').addEventListener('change', async e => { const l = [...e.target.files]; e.target.value = ''; await addFiles(l); });

/* ---------- building PDFs ---------- */
const A4 = [595.28, 841.89], M = 24;
const srcCache = new Map();
async function srcDoc(id) { if (!srcCache.has(id)) srcCache.set(id, await PDFDocument.load(files.get(id).bytes, { ignoreEncryption: false })); return srcCache.get(id); }

async function addTo(out, p) {
  if (p.kind === 'pdf') {
    const src = await srcDoc(p.file);
    const [cp] = await out.copyPages(src, [p.index]);
    const intr = ((cp.getRotation().angle % 360) + 360) % 360;
    cp.setRotation(degrees(((intr + p.rot) % 360 + 360) % 360));
    out.addPage(cp);
    if (p.ann && p.ann.length) await applyAnn(out, cp, p.ann, intr);
  } else {
    const f = files.get(p.file);
    const img = f.png ? await out.embedPng(f.bytes) : await out.embedJpg(f.bytes);
    let w = img.width, h = img.height, q = p.rot % 180;
    const land = (q ? h > w : w > h);
    const [pw, ph] = land ? [A4[1], A4[0]] : A4;
    const page = out.addPage([pw, ph]);
    const k = Math.min((pw - 2 * M) / (q ? h : w), (ph - 2 * M) / (q ? w : h));
    const dw = w * k, dh = h * k, cx = pw / 2, cy = ph / 2;
    // place the (possibly rotated) image centred
    if (!p.rot) page.drawImage(img, { x: cx - dw / 2, y: cy - dh / 2, width: dw, height: dh });
    else {
      const r = p.rot * Math.PI / 180, cos = Math.cos(r), sin = Math.sin(r);
      page.drawImage(img, { x: cx - (dw / 2) * cos + (dh / 2) * sin, y: cy - (dw / 2) * sin - (dh / 2) * cos, width: dw, height: dh, rotate: degrees(p.rot) });
    }
    if (p.ann && p.ann.length) await applyAnn(out, page, p.ann, 0);
  }
}
async function build(list) { const out = await PDFDocument.create(); for (const p of list) await addTo(out, p); out.setProducer('PDF toolkit'); out.setCreator('PDF toolkit'); return out.save(); }

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const kb = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
async function run(fn) { busy = true; render(); err(''); try { await fn(); } catch (e) { err('Something went wrong while building the PDF: ' + (e.message || e)); } busy = false; render(); }

$('save').onclick = () => run(async () => { const b = new Blob([await build(pages)], { type: 'application/pdf' }); download(b, 'toolkit.pdf'); $('tot').textContent = `Saved toolkit.pdf · ${kb(b.size)}`; });
$('selBtn').onclick = () => run(async () => { const l = pages.filter(p => p.sel); const b = new Blob([await build(l)], { type: 'application/pdf' }); download(b, 'selected.pdf'); $('tot').textContent = `Saved selected.pdf · ${l.length} pages · ${kb(b.size)}`; });
$('clear').onclick = () => { pages = []; files.clear(); srcCache.clear(); pdfCache.clear(); render(); err(''); };

/* ---------- ZIP (store only) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u8) => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(items) {
  const enc = new TextEncoder(), d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = []; let offset = 0;
  for (const it of items) {
    const data = it.data, nm = enc.encode(it.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
    parts.push(lh, nm, data); central.push(ch, nm); offset += 30 + nm.length + data.length;
  }
  const cSize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, items.length, true); end.setUint16(10, items.length, true);

async function applyAnn(out, page, anns, intr) {
  const m = mapper(page.getMediaBox(), intr);
  for (const a of anns) {
    const cov = a.t === 'cover' ? a : a.cover;
    if (cov) {
      const [x1, y1] = m.pt(cov.x, cov.y), [x2, y2] = m.pt(cov.x + cov.w, cov.y + cov.h);
      page.drawRectangle({ x: Math.min(x1, x2), y: Math.min(y1, y2), width: Math.abs(x2 - x1), height: Math.abs(y2 - y1), color: hexRgb(cov.fill), borderWidth: 0 });
    }
    if (a.t === 'text' && a.str.trim()) {
      const F = await fontsFor(out), col = hexRgb(a.color);
      a.str.split('\n').forEach((line, li) => {
        let vx = a.x; const vy = a.y + li * a.size * 1.25;
        for (const run of scriptRuns(line)) {
          const font = run.cy ? F.cyr : F.lat, [X, Y] = m.pt(vx, vy);
          page.drawText(run.s, { x: X, y: Y, size: a.size, font, color: col, rotate: degrees(m.ang) });
          vx += font.widthOfTextAtSize(run.s, a.size);
        }
      });
    }
    if (a.t === 'img') {
      const bin = atob(a.url.split(',')[1]), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const img = await out.embedPng(u8), [X, Y] = m.pt(a.x, a.y + a.h);
      page.drawImage(img, { x: X, y: Y, width: a.w, height: a.h, rotate: degrees(m.ang) });
    }
  }
}

render();
window.__toolkit = { addFiles, build, ed, get pages() { return pages; } };   // handy for tests
